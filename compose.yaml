name: student-backends
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-password}
      MYSQL_DATABASE: amazon_catalog
      MYSQL_USER: student
      MYSQL_PASSWORD: ${DB_PASSWORD:-student-local-password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  catalog:
    profiles: [apps, amazon]
    build: ./amazon-clone/catalog-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/amazon_catalog
      DB_PASSWORD: ${DB_PASSWORD:-student-local-password}
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  customer:
    profiles: [apps, amazon]
    build: ./amazon-clone/customer-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/amazon_customer
      DB_PASSWORD: ${DB_PASSWORD:-student-local-password}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env first}
      CATALOG_URL: http://catalog:8081
      MAIL_HOST: mailpit
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      catalog:
        condition: service_started
      mailpit:
        condition: service_started

  helpdesk:
    profiles: [apps, helpdesk]
    build: ./help-desk
    environment:
      DB_URL: jdbc:mysql://mysql:3306/helpdesk
      DB_PASSWORD: ${DB_PASSWORD:-student-local-password}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env first}
      MAIL_HOST: mailpit
      SPRING_PROFILES_ACTIVE: demo
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in .env}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:?Set DEMO_AGENT_PASSWORD in .env}
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  mysql-data:
