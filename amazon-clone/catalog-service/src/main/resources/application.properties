spring.application.name=catalog-service
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/amazon_catalog}
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD:student-local-password}
# Convenient for lessons. Use migrations instead for a production application.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
