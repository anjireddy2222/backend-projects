spring.application.name=customer-service
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/amazon_customer}
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD:student-local-password}
# Convenient for lessons. Use migrations instead for a production application.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=amazon_customer
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:no-reply@example.test}

app.catalog.url=${CATALOG_URL:http://localhost:8081}
